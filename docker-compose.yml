  version: '3'
  services:

    minio:
      image: minio/minio
      container_name: minio_crypto
      environment:
        - MINIO_ACCESS_KEY= ${MINIO_ACCESS_KEY}
        - MINIO_SECRET_KEY= ${MINIO_SECRET_KEY}
      ports:
        - "9000:9000"
        - "9001:9001"
      volumes:
        - minio_data:/data
      command: server /data --console-address ":9001"

    postgres_data:
      image: postgres:16
      container_name: postgres_data
      environment:
        - POSTGRES_USER= ${POSTGRES_USER}
        - POSTGRES_PASSWORD= ${POSTGRES_PASSWORD}
        - POSTGRES_DB= ${POSTGRES_DB}
        - APP_DB_USER= ${APP_DB_USER}
        - APP_DB_PASS= ${APP_DB_PASS}
        - APP_DB_NAME= ${APP_DB_NAME}
      ports:
        - "5433:5432"
      volumes:
        - pg_data:/var/lib/postgresql/data
      healthcheck:
        test: ["CMD", "pg_isready", "-q", "-d", "crypto_db", "-U", "postgres"]
        timeout: 45s
        interval: 10s
        retries: 10
    airflow:
      image: apache/airflow:2.9.2
      container_name: airflow_orquestrador
      ports:
        - "8080:8080"
      volumes:
        - ./dags:/opt/airflow/dags
        - .:/opt/project
      environment:
        - AIRFLOW__CORE__LOAD_EXAMPLES=False
        - _PIP_ADDITIONAL_REQUIREMENTS=pandas ccxt boto3 sqlalchemy psycopg2-binary dbt-postgres python-dotenv pyopenssl cryptography
      command: standalone # Comando para testes
    metabase:
      image: metabase/metabase:latest
      container_name: metabase_bi
      ports:
        - "3000:3000"
      volumes:
        - ./metabase-data:/metabase-data
      environment:
        - MB_DB_FILE=/metabase-data/metabase.db

  volumes:
    minio_data:
    pg_data: